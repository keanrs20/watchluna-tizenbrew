<!DOCTYPE html>
<html bgcolor="black">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WatchLuna</title>
    </head>
    <body></body>
    <script>
        /* WatchLuna TV wrapper v1.0.4 - diagnostics build.
         * Same hosted-first strategy, but now EVERYTHING is logged to app
         * storage (localStorage) with timestamps, and the log from the PREVIOUS
         * run is shown on-screen for 6 seconds at startup. If the app ever
         * closes by itself, reopening it shows what happened before it died.
         * Also: Back key exits cleanly; restart loop is bounded at 3 tries. */
        var app = null;
        var mode = 'init';
        var upgraded = false;
        var upgradeTries = 0;
        var restarts = 0;
        var t0 = Date.now();
        var SITE = 'https://watchluna.com/';
        var MOD = 'https://cdn.jsdelivr.net/gh/keanrs20/watchluna-tizenbrew/userscript.js';
        var FEAT = 'scrollbars=no,resizable=no,status=no,location=no,toolbar=no,menubar=no';
        var LOGKEY = 'wllog';

        function now() { return '+' + Math.round((Date.now() - t0) / 100) / 10 + 's'; }

        function saveLog(lines) {
            try { localStorage.setItem(LOGKEY, JSON.stringify({ t: Date.now(), lines: lines.slice(-80) })); } catch (e) {}
        }
        function loadLog() {
            try { return JSON.parse(localStorage.getItem(LOGKEY) || 'null'); } catch (e) { return null; }
        }

        var logLines = [];
        function log(s) {
            logLines.push(now() + ' ' + s);
            saveLog(logLines);
        }

        function say(s) {
            log(s);
            try {
                var d = document.getElementById('st');
                if (!d) {
                    d = document.createElement('div');
                    d.id = 'st';
                    d.style.cssText = 'position:fixed;left:8px;bottom:8px;color:#fff;background:rgba(0,0,0,.7);font:16px monospace;padding:6px 10px;z-index:2147483647;';
                    document.body.appendChild(d);
                }
                d.textContent = s;
            } catch (e) {}
        }

        window.onerror = function (m, u, l) { say('ERR: ' + m + ' @' + (u || '?') + ':' + l); return false; };

        window.addEventListener('unload', function () { log('PARENT-UNLOAD'); });
        window.addEventListener('pagehide', function () { log('PARENT-PAGEHIDE'); });
        document.addEventListener('visibilitychange', function () { log('parent visibility=' + document.visibilityState); });

        function showPrevRun(done) {
            var prev = loadLog();
            if (!prev || !prev.lines || !prev.lines.length) { done(); return; }
            var d = document.createElement('div');
            d.style.cssText = 'position:fixed;left:20px;top:20px;color:#0f0;background:rgba(0,0,0,.85);font:13px monospace;padding:10px 14px;z-index:2147483647;max-width:90%;white-space:pre-wrap;';
            var age = Math.round((Date.now() - prev.t) / 1000);
            d.textContent = '=== last run (' + age + 's ago) ===\n' + prev.lines.join('\n');
            document.body.appendChild(d);
            setTimeout(function () { try { d.remove(); } catch (e) {} done(); }, 6000);
        }

        function shimSource() {
            return '' +
                'try{tizen.tvinputdevice.registerKey("Back");}catch(e){}' +
                'try{tizen.tvinputdevice.registerKey("Exit");}catch(e){}' +
                'document.addEventListener("keydown",function(e){' +
                ' if(e.keyCode===10009){ if(history.length>1){history.back();}else{window.opener.postMessage({action:"exit"},"*");} e.preventDefault(); }' +
                ' if(e.keyCode===10182||e.keyCode===10131){window.opener.postMessage({action:"exit"},"*");}' +
                '},true);' +
                'var b=document.createElement("div");b.textContent="WatchLuna mod OK";' +
                'b.style.cssText="position:fixed;left:8px;bottom:8px;color:#fff;background:rgba(0,0,0,.7);font:14px monospace;padding:4px 8px;z-index:2147483647;opacity:.9;";' +
                'document.body.appendChild(b);setTimeout(function(){b.remove();},6000);';
        }

        function injectInto(parsed) {
            var s = parsed.createElement('script');
            s.textContent = 'history.replaceState({}, "", ' + JSON.stringify(SITE) + ');' + shimSource();
            parsed.head.appendChild(s);

            var base = parsed.createElement('base');
            base.href = SITE;
            parsed.head.insertBefore(base, parsed.head.firstChild);

            var m = parsed.createElement('script');
            m.type = 'module';
            m.textContent = "import('" + MOD + "?t=' + Date.now());";
            parsed.head.appendChild(m);
        }

        function looksChallenged(html) {
            return /Just a moment|cf-chl|challenge-platform|turnstile/i.test(html);
        }

        function tryUpgrade() {
            if (upgraded || mode !== 'hosted') return;
            upgradeTries++;
            say('checking ad-block availability (try ' + upgradeTries + ')...');
            fetch(SITE, { cache: 'no-store' })
                .then(function (r) { return r.text().then(function (t) { return { s: r.status, h: t }; }); })
                .then(function (res) {
                    if (res.s !== 200 || res.h.length < 500 || looksChallenged(res.h)) {
                        say('cf not satisfied yet (http ' + res.s + ') - staying in direct mode');
                        return;
                    }
                    var parsed = new DOMParser().parseFromString(res.h, 'text/html');
                    injectInto(parsed);
                    try { app.close(); } catch (_) {}
                    app = window.open('about:blank', 'app', FEAT);
                    if (!app) { say('upgrade failed: could not reopen window'); return; }
                    mode = 'injected';
                    upgraded = true;
                    var doc = app.document;
                    doc.open();
                    doc.write(new XMLSerializer().serializeToString(parsed.doctype) + parsed.documentElement.outerHTML);
                    doc.close();
                    say('mod active - page reloaded once');
                })
                .catch(function (e) { say('upgrade check failed: ' + e.message); });
        }

        function openApp() {
            if (restarts >= 3) { say('giving up after 3 restarts - see log at next launch'); return; }
            say('opening site directly...');
            app = window.open(SITE, 'app', FEAT);
            if (!app) { say('window.open returned null - blocked'); return; }
            mode = 'hosted';
            log('child window opened (hosted)');
            say('site loading directly (ad-block enables itself when possible)');
            setTimeout(tryUpgrade, 6000);
            setTimeout(tryUpgrade, 25000);
            setTimeout(tryUpgrade, 60000);
        }

        var lastClosed = false;
        setInterval(function () {
            try {
                if (!app) return;
                if (mode === 'hosted') {
                    if (app.closed && !lastClosed) { log('CHILD-CLOSED by page/system (mode=hosted)'); lastClosed = true; reload(); }
                    else if (!app.closed) { lastClosed = false; }
                } else if (mode === 'injected') {
                    if (app.tizen === undefined) { log('injected child lost tizen -> reload'); reload(); }
                }
            } catch (e) { log('watchdog err: ' + e.message); }
        }, 3000);

        window.onclick = function () { if (mode === 'init') openApp(); };

        function exit() {
            log('exit() called (Back/Exit key)');
            try { app.close(); } catch (_) {}
            setTimeout(function () { tizen.application.getCurrentApplication().exit(); }, 150);
        }

        function reload() {
            restarts++;
            try { app.close(); } catch (_) {}
            mode = 'init';
            say('window closed -> restarting (' + restarts + '/3)');
            run();
        }

        window.addEventListener('message', function (evt) {
            if (evt.data && evt.data.action === 'exit') exit();
        });

        /* parent-side key handling (used when this window has focus) */
        ['Back', 'Exit', 'MediaPlay', 'MediaPause', 'MediaStop'].forEach(function (k) {
            try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
        });
        document.addEventListener('keydown', function (e) {
            log('parent key ' + e.keyCode);
            if (e.keyCode === 10009 || e.keyCode === 10182 || e.keyCode === 10131) exit();
        }, true);

        function run() { setTimeout(function () { document.body.click(); }, 50); }

        say('boot v1.0.4');
        showPrevRun(run);
    </script>
</html>
